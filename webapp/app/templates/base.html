<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BMAD Dashboard{% endblock %}</title>
    
    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bmad-primary': '#6366f1',
                        'bmad-secondary': '#10b981',
                        'bmad-accent': '#f59e0b',
                        'bmad-dark': '#1e1b4b',
                    }
                }
            }
        }
    </script>
    
    <!-- Alpine.js for interactivity -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Chart.js for analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Custom styles -->
    <style>
        [x-cloak] { display: none !important; }
        
        /* Smooth transitions */
        .sidebar-item {
            transition: all 0.2s ease-in-out;
        }
        
        /* Gradient backgrounds */
        .gradient-primary {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        }
        
        .gradient-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        
        .gradient-warning {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }
        
        .gradient-info {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }
        
        /* Card hover effects */
        .card-hover {
            transition: all 0.3s ease;
        }
        
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        /* Pulse animation for active items */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        
        .pulse-active::before {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse-ring 1.5s infinite;
        }
    </style>
    
    {% block extra_head %}{% endblock %}
</head>
<body class="h-full bg-gray-50" x-data="{ sidebarOpen: true, mobileMenuOpen: false }">
    <div class="min-h-full">
        <!-- Mobile menu backdrop -->
        <div x-show="mobileMenuOpen" 
             x-transition:enter="transition-opacity ease-linear duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="transition-opacity ease-linear duration-300"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             class="fixed inset-0 z-40 bg-gray-900/80 lg:hidden"
             @click="mobileMenuOpen = false"
             x-cloak>
        </div>
        
        <!-- Sidebar -->
        <aside :class="sidebarOpen ? 'w-64' : 'w-20'" 
               class="fixed inset-y-0 left-0 z-50 flex flex-col bg-bmad-dark transition-all duration-300 ease-in-out hidden lg:flex">
            
            <!-- Logo -->
            <div class="flex h-16 items-center justify-center border-b border-indigo-800">
                <div class="flex items-center space-x-3">
                    <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-bmad-primary text-white font-bold text-xl">
                        B
                    </div>
                    <span x-show="sidebarOpen" x-transition class="text-white font-semibold text-lg">
                        BMAD
                    </span>
                </div>
            </div>
            
            <!-- Navigation -->
            <nav class="flex-1 space-y-1 px-3 py-4 overflow-y-auto">
                <a href="{{ url_for('main.dashboard') }}" 
                   class="sidebar-item flex items-center px-3 py-2.5 rounded-lg text-sm font-medium
                          {{ 'bg-bmad-primary text-white' if request.endpoint == 'main.dashboard' else 'text-indigo-200 hover:bg-indigo-800 hover:text-white' }}">
                    <svg class="h-5 w-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                    <span x-show="sidebarOpen" x-transition class="ml-3">Dashboard</span>
                </a>
                
                <a href="{{ url_for('main.agents') }}" 
                   class="sidebar-item flex items-center px-3 py-2.5 rounded-lg text-sm font-medium
                          {{ 'bg-bmad-primary text-white' if 'agents' in request.endpoint else 'text-indigo-200 hover:bg-indigo-800 hover:text-white' }}">
                    <svg class="h-5 w-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                    </svg>
                    <span x-show="sidebarOpen" x-transition class="ml-3">Agents</span>
                </a>
                
                <a href="{{ url_for('main.workflows') }}" 
                   class="sidebar-item flex items-center px-3 py-2.5 rounded-lg text-sm font-medium
                          {{ 'bg-bmad-primary text-white' if 'workflows' in request.endpoint else 'text-indigo-200 hover:bg-indigo-800 hover:text-white' }}">
                    <svg class="h-5 w-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
                    </svg>
                    <span x-show="sidebarOpen" x-transition class="ml-3">Workflows</span>
                </a>
                
                <a href="{{ url_for('main.modules') }}" 
                   class="sidebar-item flex items-center px-3 py-2.5 rounded-lg text-sm font-medium
                          {{ 'bg-bmad-primary text-white' if 'modules' in request.endpoint else 'text-indigo-200 hover:bg-indigo-800 hover:text-white' }}">
                    <svg class="h-5 w-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
                    </svg>
                    <span x-show="sidebarOpen" x-transition class="ml-3">Modules</span>
                </a>
                
                <div class="pt-4 mt-4 border-t border-indigo-800">
                    <span x-show="sidebarOpen" x-transition class="px-3 text-xs font-semibold text-indigo-400 uppercase tracking-wider">
                        Project
                    </span>
                </div>
                
                <a href="{{ url_for('main.projects') }}" 
                   class="sidebar-item flex items-center px-3 py-2.5 rounded-lg text-sm font-medium
                          {{ 'bg-bmad-primary text-white' if 'projects' in request.endpoint else 'text-indigo-200 hover:bg-indigo-800 hover:text-white' }}">
                    <svg class="h-5 w-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
                    </svg>
                    <span x-show="sidebarOpen" x-transition class="ml-3">Projects</span>
                </a>
                
                <a href="{{ url_for('main.analytics') }}" 
                   class="sidebar-item flex items-center px-3 py-2.5 rounded-lg text-sm font-medium
                          {{ 'bg-bmad-primary text-white' if 'analytics' in request.endpoint else 'text-indigo-200 hover:bg-indigo-800 hover:text-white' }}">
                    <svg class="h-5 w-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                    </svg>
                    <span x-show="sidebarOpen" x-transition class="ml-3">Analytics</span>
                </a>
            </nav>
            
            <!-- Toggle button -->
            <div class="border-t border-indigo-800 p-3">
                <button @click="sidebarOpen = !sidebarOpen" 
                        class="flex w-full items-center justify-center rounded-lg py-2 text-indigo-200 hover:bg-indigo-800 hover:text-white">
                    <svg :class="sidebarOpen ? 'rotate-180' : ''" class="h-5 w-5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/>
                    </svg>
                </button>
            </div>
        </aside>
        
        <!-- Main content -->
        <main :class="sidebarOpen ? 'lg:pl-64' : 'lg:pl-20'" class="transition-all duration-300 ease-in-out">
            <!-- Top header -->
            <header class="sticky top-0 z-40 bg-white shadow-sm">
                <div class="flex h-16 items-center justify-between px-4 sm:px-6 lg:px-8">
                    <!-- Mobile menu button -->
                    <button @click="mobileMenuOpen = true" class="lg:hidden -m-2.5 p-2.5 text-gray-700">
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </button>
                    
                    <!-- Page title -->
                    <div class="flex-1 lg:flex-none">
                        <h1 class="text-xl font-semibold text-gray-900">{% block page_title %}Dashboard{% endblock %}</h1>
                    </div>
                    
                    <!-- Right side actions -->
                    <div class="flex items-center space-x-4">
                        <!-- Search -->
                        <div class="hidden sm:block">
                            <div class="relative">
                                <input type="text" placeholder="Search..." 
                                       class="w-64 rounded-lg border-gray-300 bg-gray-50 pl-10 pr-4 py-2 text-sm focus:border-bmad-primary focus:ring-bmad-primary">
                                <svg class="absolute left-3 top-2.5 h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                                </svg>
                            </div>
                        </div>
                        
                        <!-- Notifications -->
                        <button class="relative rounded-full p-2 text-gray-500 hover:bg-gray-100 hover:text-gray-700">
                            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                            </svg>
                            <span class="absolute top-1 right-1 h-2 w-2 rounded-full bg-red-500"></span>
                        </button>
                        
                        <!-- Profile -->
                        <div class="flex items-center space-x-2">
                            <div class="h-8 w-8 rounded-full bg-bmad-primary flex items-center justify-center text-white font-medium text-sm">
                                BM
                            </div>
                        </div>
                    </div>
                </div>
            </header>
            
            <!-- Page content -->
            <div class="py-6 px-4 sm:px-6 lg:px-8">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
